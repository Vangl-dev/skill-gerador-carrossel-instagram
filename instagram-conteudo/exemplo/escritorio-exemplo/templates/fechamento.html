<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gostou do conteúdo?</title>
<link href="https://fonts.googleapis.com/css2?{{FONTES_URL}}&display=swap" rel="stylesheet">
<style>
/* Fechamento de toda campanha. O render preenche as cores e fontes da campanha. */
:root {
  --cor-fundo-escuro: {{COR_FUNDO_ESCURO}};
  --cor-destaque: {{COR_ACCENT}};
  --cor-texto-claro: {{COR_TEXTO_CLARO}};
  --cor-texto-escuro: {{COR_TEXTO_ESCURO}};
  --fonte-titulo: {{FONTE_TITULO}};
  --fonte-corpo: {{FONTE_CORPO}};
  --peso-titulo: {{PESO_TITULO}};
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body { background: #e9e9e9; font-family: var(--fonte-corpo); overflow: auto; }

.art {
  position: relative;
  width: {{LARGURA}}px;
  height: {{ALTURA}}px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 150px 80px 120px;
  background: var(--cor-fundo-escuro);
  color: var(--cor-texto-claro);
}

/* título com fundo destacado por linha */
.titulo {
  font-family: var(--fonte-titulo);
  font-weight: var(--peso-titulo);
  font-size: 118px;
  line-height: 1.22;
  color: var(--cor-texto-escuro);
}
.titulo span {
  background: var(--cor-destaque);
  padding: 0 26px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

.apoio {
  margin-top: 44px;
  font-size: 34px;
  font-weight: 500;
  line-height: 1.45;
}

.marca {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 70px;
}
.marca .logo { width: 470px; height: auto; }

.icones { display: flex; gap: 74px; }
.icones svg { width: 84px; height: 84px; fill: var(--cor-texto-claro); }
</style>
</head>
<body>
<div class="art">
  <h1 class="titulo"><span>Gostou do<br>conteúdo?</span></h1>
  <p class="apoio">Então curta e siga para não perder<br>os próximos conteúdos.</p>

  <div class="marca">
    {{LOGO}}
    <div class="icones">
      <!-- curtir -->
      <svg viewBox="0 0 24 24"><path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <!-- comentar -->
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.04 2 11c0 2.4 1.05 4.58 2.76 6.2L3.5 22l5.03-2.2c1.08.3 2.24.47 3.47.47 5.52 0 10-4.04 10-9S17.52 2 12 2z"/></svg>
      <!-- compartilhar -->
      <svg viewBox="0 0 24 24"><path d="M22 2 2 9.5l7.6 3.1L18 6l-6.6 8.4L14.5 22 22 2z"/></svg>
      <!-- salvar -->
      <svg viewBox="0 0 24 24"><path d="M5 2h14v20l-7-5.2L5 22V2z"/></svg>
    </div>
  </div>
</div>
</body>
</html>
